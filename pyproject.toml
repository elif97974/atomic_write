[project]
name = "atomic-write"
version = "0.1.2"
description = "Write files atomically so readers never see a half-written file."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
